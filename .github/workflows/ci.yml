name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - name: Build sandbox images
        run: docker compose build sandbox-python sandbox-cpp
      - name: Sandbox and containment tests
        run: pnpm test:sandbox
      - name: Validate all content
        run: pnpm content:validate --all

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - name: Build and start (test mode: fake AI provider and data reset for e2e)
        run: SWEMOCK_TEST_MODE=1 docker compose up -d --build --wait --wait-timeout 180
      - name: Health
        run: |
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/runner/status | tee /dev/stderr | grep -q '"ok":true'
      - name: Judge a submission through the app
        run: |
          curl -fsS -X POST -H 'content-type: application/json' http://127.0.0.1:3000/api/playground/dsa \
            -d '{"language":"python","code":"class Solution:\n    def runningMax(self, nums):\n        out, m = [], None\n        for x in nums:\n            m = x if m is None else max(m, x)\n            out.append(m)\n        return out\n"}' \
            | tee /dev/stderr | grep -q '"verdict":"accepted"'
      - name: Install the e2e browser
        run: pnpm --filter @swemock/web exec playwright install --with-deps chromium
      - name: End-to-end tests (real judge, production images)
        run: pnpm e2e
      - name: Logs
        if: always()
        run: docker compose logs
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore
