title: __TITLE__
difficulty: __DIFFICULTY__           # easy | medium | hard
tags: [data-structures]              # FLUENCY_TAGS in packages/content/src/fluency/manifest.ts
source: authored
reviewed: false
version: 1
language: python
minutes: 60

brief: |
  `inventory.py` keeps stock levels for a small shop: adding stock, selling items, and listing what is running low.
  Read it, find what is wrong with it, and be ready to discuss how you would improve it.

# Planted bugs: line ranges are in code/<file>. Each needs a fix (an exact replacement) and a test in bugtests/.
bugs:
  - id: negative-stock
    file: inventory.py
    lines: [14, 16]
    category: missing-validation
    severity: high
    title: sell() lets stock go negative
    explanation: The check compares against the wrong value, so selling more than is in stock succeeds and leaves a negative quantity.
    fix: { file: inventory.py, old: "if qty > self.stock.get(sku, 0) + 1:", new: "if qty > self.stock.get(sku, 0):" }
  - id: shared-default
    file: inventory.py
    lines: [8, 8]
    category: mutable-default
    severity: medium
    title: Mutable default argument shares state between shops
    explanation: The default `{}` is created once, so every Inventory built without an argument shares one dictionary.
    fix: { file: inventory.py, old: "def __init__(self, initial={}):\n        self.stock = initial", new: "def __init__(self, initial=None):\n        self.stock = dict(initial or {})" }
  - id: low-boundary
    file: inventory.py
    lines: [21, 24]
    category: off-by-one
    severity: medium
    title: low_stock() misses items exactly at the threshold
    explanation: The comparison uses `<` where the documented behavior is "at or below the threshold".
    fix: { file: inventory.py, old: "if n < threshold", new: "if n <= threshold" }
  - id: swallowed
    file: inventory.py
    lines: [26, 29]
    category: swallowed-error
    severity: low
    title: restock() hides invalid input
    explanation: A bare `except` turns every error, including a non-numeric quantity, into a silent no-op.
    fix: { file: inventory.py, old: "except Exception:\n            pass", new: "except (TypeError, ValueError):\n            raise" }

decisions:
  - id: dict-storage
    title: Stock lives in a plain dictionary
    for: Simple, fast, and trivial to inspect in tests.
    against: Nothing stops callers from mutating `stock` directly and bypassing the checks.
  - id: no-logging
    title: Sales are not logged
    for: Keeps the class small and focused.
    against: A shop would want an audit trail of every change in stock.

improvements:
  - Make `stock` private and expose read-only views.
  - Return a result object from `sell` instead of a bare bool.
  - Add an audit log of stock changes.

acceptable:
  - { file: inventory.py, lines: [1, 3], category: style, note: The module has no docstring; harmless in a small file. }

questions:
  - Walk me through what sell() does when the item is not in stock at all.
  - Why might the author have used a dictionary here, and what would you change at 100x the number of items?
  - Which of these bugs would you fix first, and why?
