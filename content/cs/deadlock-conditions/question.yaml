title: Conditions for a deadlock
difficulty: medium
topics: [os, concurrency]
source: authored
reviewed: false
version: 1
prompt: |
  What conditions must hold for a deadlock to occur, and how would you prevent one in a program that takes several locks?
key_points:
  - Mutual exclusion: a resource can be held by only one thread at a time
  - Hold and wait: a thread holds one resource while waiting for another
  - No preemption: resources can't be taken away from the thread holding them
  - Circular wait: a cycle of threads each waiting for a resource the next one holds
  - Breaking any one condition prevents deadlock; the practical fix is a global lock ordering that removes circular wait
  - Other tools are try-lock with back-off or timeouts, acquiring all locks at once, and avoiding nested locking altogether
model_answer: |
  Deadlock needs all four of mutual exclusion, hold-and-wait, no preemption, and circular wait. Removing one is enough;
  the usual approach is to always acquire locks in one agreed order so a cycle can't form, or to use timeouts and retries.
follow_up: How is a deadlock different from a livelock or starvation?
