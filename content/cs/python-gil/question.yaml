title: The Python GIL
difficulty: medium
topics: [python, concurrency]
source: authored
reviewed: false
version: 1
prompt: |
  What is the GIL in CPython, and how does it affect threads and the way you'd parallelize a Python program?
key_points:
  - The global interpreter lock lets only one thread execute Python bytecode at a time in a CPython process
  - CPU-bound code in multiple threads doesn't run in parallel, but I/O-bound threads work well because the lock is released while waiting
  - For CPU-bound work use multiprocessing (separate processes), or native extensions that release the lock
  - asyncio gives concurrency for I/O without threads
  - The GIL protects the interpreter's internals, not your data, so you still need locks for compound operations; recent CPython versions offer an optional free-threaded build
model_answer: |
  The GIL serializes Python bytecode execution within a process, so threads help with I/O but not with CPU-bound work.
  Use processes or native code for CPU parallelism, and asyncio or threads for waiting on I/O.
follow_up: Is `counter += 1` thread-safe under the GIL?
