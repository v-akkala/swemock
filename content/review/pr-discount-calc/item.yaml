pr:
  title: Add apply_discount for percentage discounts
  description: |
    Adds `apply_discount(total_cents, percent, cap_cents=None)` to `pricing.py`.

    - Works in integer cents; the discount is rounded half up with integer arithmetic (no floats).
    - `percent` must be 0..100, otherwise ValueError.
    - An optional cap limits the discount.

    Tests in `test_discounts.py` cover rounding, the cap, the boundaries, and invalid input.

decision: approve

